[pytest]
# Repo convention is Test_*.py (capital T). Without this pattern pytest's
# default (test_*.py only) silently collects ZERO tests from Tests/ - the
# forensics audit found `pytest Tests/` returning "no tests ran", which can
# mask every regression in CI. Keep both patterns for compatibility.
python_files = Test_*.py test_*.py
testpaths = Tests
addopts = -p no:cacheprovider

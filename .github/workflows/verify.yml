name: Verification & Governance Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest polars openpyxl websockets
      - name: Run Core Governance & Gate Tests
        run: |
          python -m pytest Tests/Test_Gates.py Tests/Test_Blueberry_Fixture.py Tests/Test_Quantitative_Governance.py
